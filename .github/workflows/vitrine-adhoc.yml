name: Vitrine - sign prebuilt Ad Hoc IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitrine-adhoc
  cancel-in-progress: false

jobs:
  build-and-sign:
    if: github.ref == 'refs/heads/main' && github.repository == 'Soufiane-Fartit/vitrine'
    runs-on: macos-26
    timeout-minutes: 50
    env:
      VITRINE_APP_ID: com.soufianefartit.vitrine
      VITRINE_SIGNING_MANIFEST: /tmp/vitrine-ids.json
      VITRINE_SIGNING_DIR: /tmp/vitrine-match-export
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      TEAMID: ${{ secrets.TEAMID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify signing configuration
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          IPA_ARCHIVE_PASSWORD: ${{ secrets.IPA_ARCHIVE_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          for name in FASTLANE_KEY_ID FASTLANE_ISSUER_ID FASTLANE_KEY TEAMID MATCH_PASSWORD GH_PAT IPA_ARCHIVE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing Vitrine Actions secret: ${name}"
              exit 1
            fi
          done
          [ "${#IPA_ARCHIVE_PASSWORD}" -ge 20 ] || { echo '::error::Use a strong (20+ character) IPA_ARCHIVE_PASSWORD'; exit 1; }
          echo "::add-mask::$IPA_ARCHIVE_PASSWORD"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install signing tools
        shell: bash
        run: |
          set -euo pipefail
          brew install zsign sevenzip
          gem install fastlane --no-document

      - name: Download pinned third-party Vitrine IPA and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          IPA_URL='https://github.com/estrogencat/EeveeIPA/releases/download/1.0.0-beta.16-LG-2026-10-26-11-29-04/EeveeSpotify-9.1.90-ESR-1.0.0-beta.16-LG-patched.ipa'
          EXPECTED_SHA256='b9e32500c9f31a318ab30124a292c39560f7e088d036957b1e7782b946be6685'
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/vitrine-prebuilt.ipa" "$IPA_URL"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/vitrine-prebuilt.ipa" | shasum -a 256 --check
          unzip -tqq "$RUNNER_TEMP/vitrine-prebuilt.ipa"
          echo 'Downloaded pinned Vitrine beta.16 / Spotify 9.1.90 (certificate-patched IPA).'

      - name: Prepare personal app IDs and enumerate nested extensions
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/vitrine_adhoc.py prepare "$RUNNER_TEMP/vitrine-prebuilt.ipa" "$RUNNER_TEMP/vitrine-prepared.ipa" "$VITRINE_SIGNING_MANIFEST" --app-id "$VITRINE_APP_ID"
          {
            echo '## Vitrine prebuilt Ad Hoc'
            echo
            echo 'Source: estrogencat/EeveeIPA, Vitrine 1.0.0-beta.16 (Spotify 9.1.90)'
            echo 'SHA-256 verified against release metadata.'
            echo
            echo 'App identifiers:'
            python3 -c 'import json,os; print("\n".join("- `"+x+"`" for x in json.load(open(os.environ["VITRINE_SIGNING_MANIFEST"]))["bundle_ids"]))'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reuse existing Match identity and generate Vitrine profiles
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set +x
          set -euo pipefail
          mkdir -p "$VITRINE_SIGNING_DIR"
          export MATCH_GIT_BASIC_AUTHORIZATION
          MATCH_GIT_BASIC_AUTHORIZATION="$(printf '%s:%s' "$GITHUB_REPOSITORY_OWNER" "$GH_PAT" | base64 | tr -d '\r\n')"
          echo "::add-mask::$MATCH_GIT_BASIC_AUTHORIZATION"
          unset GH_PAT
          fastlane ios sync_vitrine_adhoc

      - name: Sign and verify IPA with each extension profile
        shell: bash
        run: |
          set +x
          set -euo pipefail
          python3 ci/vitrine_adhoc.py sign "$RUNNER_TEMP/vitrine-prepared.ipa" "$RUNNER_TEMP/vitrine-adhoc.ipa" "$VITRINE_SIGNING_MANIFEST" "$VITRINE_SIGNING_DIR"

      - name: Encrypt IPA for private download from a public fork
        shell: bash
        env:
          IPA_ARCHIVE_PASSWORD: ${{ secrets.IPA_ARCHIVE_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/download"
          cd "$RUNNER_TEMP"
          7zz a -bd -y -t7z -m0=lzma2 -mhe=on -p"$IPA_ARCHIVE_PASSWORD" download/vitrine-adhoc.7z vitrine-adhoc.ipa >/dev/null
          echo 'Signed IPA encrypted with AES-256 for download.'

      - name: Download encrypted IPA archive
        uses: actions/upload-artifact@v5
        with:
          name: vitrine-adhoc-encrypted
          path: ${{ runner.temp }}/download/vitrine-adhoc.7z
          if-no-files-found: error
          retention-days: 7
